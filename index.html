<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mente Mapa</title><link rel="stylesheet" href="style.css"></head><body><main class="product"><aside class="sidebar"><a class="brand" href="#">mente<span>mapa</span></a><nav id="nav" aria-label="Navegação principal"><button data-view="inbox">⌂ Inbox</button><button data-view="today">☀ Hoje</button><button data-view="map" class="active">⌘ Mapa</button><button data-view="projects">□ Projetos</button><button data-view="ideas">✦ Ideias</button><button data-view="goals">◎ Metas</button><button data-view="review">↻ Revisão</button></nav><div class="sidebar-bottom"><button id="exportMap">Exportar</button><button id="importMap">Importar</button><input id="importFile" type="file" accept="application/json" hidden></div></aside><section class="main"><header class="appbar"><button id="menu" aria-label="Abrir navegação">☰</button><div><small id="eyebrow">SISTEMA PARA PENSAR MELHOR</small><h1 id="viewTitle">Mapa</h1></div><input id="search" placeholder="Buscar em tudo...  /" aria-label="Busca global"><button id="newItem">+ Novo</button></header><section id="capture" class="capture"><label for="captureInput">O que está na sua cabeça?</label><div><textarea id="captureInput" placeholder="Escreva um pensamento, uma tarefa ou uma ideia..."></textarea><button id="captureButton">Capturar ↗</button></div></section><section id="content"></section></section><aside id="panel" class="panel"><div id="emptyPanel"><b>Selecione algo</b><p>Escolha um item para organizar, conectar ou transformar em ação.</p></div><form id="editor" hidden><small id="meta"></small><label>Título<input id="title" required maxlength="80"></label><label>Descrição<textarea id="description" rows="4"></textarea></label><div class="trio"><label>Tipo<select id="type"><option>pensamento</option><option>ideia</option><option>tarefa</option><option>projeto</option><option>meta</option><option>problema</option><option>decisão</option><option>nota</option></select></label><label>Status<select id="status"><option>capturado</option><option>planejando</option><option>em andamento</option><option>aguardando</option><option>concluído</option><option>arquivado</option></select></label><label>Prioridade<select id="priority"><option>baixa</option><option selected>média</option><option>alta</option></select></label></div><label>Tags<input id="tags" placeholder="estudo, importante"></label><button>Salvar alterações</button><button type="button" id="toTask">Transformar em tarefa</button><button type="button" id="toProject">Transformar em projeto</button><hr><b>Conexões</b><div class="connect"><select id="target"></select><button type="button" id="connect">Conectar</button></div><div id="links"></div><button type="button" id="delete">Excluir</button></form></aside></main><div id="toast" role="status"></div><script src="script.js"></script></body></html>
